name: deb-deps
description: Build and install the Debian build dependencies the distribution does not carry

# libmod-host-protocol0 and libmod-host-protocol-dev from mod-host and the patches of packaging/mod-host, the CLAP
# headers from the free-audio/clap commit of .github/pins.txt: what a FreeMixer package Build-Depends on.
# The protocol library is published with the packages that link it; the CLAP headers are published as
# clap-headers by clap-headers-deb.yml, and the -dev packages that Depend on them install it from there.
# The caller runs as root in a Debian container with dpkg-dev, debhelper, build-essential, git and lintian.

inputs:
  names:
    description: which of the dependencies to build, space separated
    default: mod-host-protocol clap-headers
  out:
    description: directory the .deb files are copied to
    default: dep-debs

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NAMES: ${{ inputs.names }}
        OUT: ${{ inputs.out }}
      run: '"$GITHUB_ACTION_PATH/build.sh" "$OUT" $NAMES'
