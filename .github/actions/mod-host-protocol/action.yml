name: mod-host-protocol
description: Build libmod-host-protocol from the FreeMixer fork of mod-host and install it into a prefix

# One way to get the protocol library for every FreeMixer host repository's source build: the fork at the commit
# .github/pins.txt names, the same source as the published packages. The installed library is checked by
# checks/framing-test.sh. The caller has git, gcc, make, python3 and pkg-config.

inputs:
  prefix:
    description: where the library, its headers and its pkg-config file are installed
    default: /opt/mod-host-protocol

runs:
  using: composite
  steps:
    # PKG_CONFIG_PATH finds the library at build time and LD_LIBRARY_PATH at run time: the
    # .pc file carries no rpath. MOD_HOST_DIR is the source tree, which holds the scenario corpus
    # and README that plugin-hostd's contract test reads.
    - name: Install the protocol library
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/fetch-source.sh" mod-host
        make -C mod-host lib
        make -C mod-host install-lib PREFIX="$PREFIX" LIBDIR="$PREFIX/lib"
        {
          echo "MOD_HOST_DIR=$GITHUB_WORKSPACE/mod-host"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          echo "LD_LIBRARY_PATH=$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"
        PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" pkg-config --modversion mod-host-protocol
        "$GITHUB_ACTION_PATH/checks/framing-test.sh" "$PREFIX"
