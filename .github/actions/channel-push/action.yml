name: channel-push
description: Commit what the tree scripts changed in build/channel and push it

inputs:
  publish-token:
    required: true
  site-gpg-key:
    description: the SITE_GPG_KEY organisation secret, armored; every commit this action makes is signed with it
    required: true
  channel:
    required: true
  branch:
    default: main
  tag:
    description: the release tag, for the commit message
    required: true
  what:
    description: rpm or deb, for the commit message and the paths added
    required: true

  rebuild:
    description: >-
      Command that assembles the tree again in build/channel (the publish-tree.sh call that made it). A push
      that lost a race resets build/channel to the new tip of the branch, runs this, and commits and pushes
      again. Empty means a lost race fails the step.
    default: ''
  attempts:
    description: how many times the push is tried
    default: '6'
  site-url:
    description: >-
      Where the channel is served. After the push the step waits until this site serves every package the
      commit added (live-check.sh): Pages cancels a deployment when the next push arrives, so the commit can be
      right while the site serves the tree before it. Empty skips the wait.
    default: https://www.openmixer.org

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
        SITE_GPG_KEY: ${{ inputs.site-gpg-key }}
        BRANCH: ${{ inputs.branch }}
        CHANNEL: ${{ inputs.channel }}
        TAG: ${{ inputs.tag }}
        WHAT: ${{ inputs.what }}
        REBUILD: ${{ inputs.rebuild }}
        ATTEMPTS: ${{ inputs.attempts }}
        SITE_URL: ${{ inputs.site-url }}
      run: |
        set -o pipefail
        git -C build/channel add -A "$WHAT"
        if git -C build/channel diff --cached --quiet; then
          echo "the channel already carries this exact tree -- nothing to push"
          exit 0
        fi
        # Signed or nothing: the key goes into a private keyring (never the RPM signing keyring), and a
        # commit that cannot be signed stops the publish before the push.
        test -n "$SITE_GPG_KEY" || { echo "::error::SITE_GPG_KEY is not set; the channel commit must be signed"; exit 1; }
        # the rebuild signs the packages with the release key, not with the site key of the commits
        ORIG_GNUPGHOME=${GNUPGHOME-}
        export GNUPGHOME="$RUNNER_TEMP/site-gnupg"; rm -rf "$GNUPGHOME"; mkdir -m 700 "$GNUPGHOME"
        printf '%s\n' "$SITE_GPG_KEY" | gpg --batch --quiet --import
        SITE_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
        test -n "$SITE_KEY_ID" || { echo "::error::no secret key imported from SITE_GPG_KEY"; exit 1; }
        git -C build/channel -c user.name="Pau Aliagas" -c user.email=linuxnow@gmail.com \
          -c user.signingkey="$SITE_KEY_ID" commit -q -S -m "$WHAT: publish $TAG (${GITHUB_REPOSITORY##*/})"
        auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        push() {
          git -C build/channel -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"
        }
        # Another package's release can push to the channel between our pull and our push. The tree is
        # shared and only a fast-forward is accepted, so a lost race is repeated on the new tip: the
        # tree is assembled again there (never rebased: the metadata of two publishes conflicts) and the
        # commit is signed again.
        attempt=1
        until push; do
          if [ -z "$REBUILD" ] || [ "$attempt" -ge "$ATTEMPTS" ]; then
            echo "::error::the push to $CHANNEL@$BRANCH failed after $attempt attempt(s)"
            exit 1
          fi
          wait=$(( (RANDOM % 10) + 5 * attempt ))
          echo "::warning::the push to $CHANNEL@$BRANCH lost a race (attempt $attempt of $ATTEMPTS); again in ${wait}s on the new tip"
          sleep "$wait"
          git -C build/channel -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch -q origin "$BRANCH"
          git -C build/channel reset -q --hard FETCH_HEAD
          if [ -n "$ORIG_GNUPGHOME" ]; then GNUPGHOME=$ORIG_GNUPGHOME bash -c "$REBUILD"; else env -u GNUPGHOME bash -c "$REBUILD"; fi
          git -C build/channel add -A "$WHAT"
          if git -C build/channel diff --cached --quiet; then
            echo "the channel now carries this exact tree -- nothing to push"
            exit 0
          fi
          git -C build/channel -c user.name="Pau Aliagas" -c user.email=linuxnow@gmail.com \
            -c user.signingkey="$SITE_KEY_ID" commit -q -S -m "$WHAT: publish $TAG (${GITHUB_REPOSITORY##*/})"
          attempt=$((attempt + 1))
        done
        gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"
        echo "published $TAG to $CHANNEL@$BRANCH"
        if [ -n "$SITE_URL" ]; then
          GH_TOKEN=$PUBLISH_TOKEN bash "$GITHUB_ACTION_PATH/live-check.sh" build/channel "$WHAT" "$SITE_URL" "$CHANNEL"
        fi
