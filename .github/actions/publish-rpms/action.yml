name: publish-rpms
description: Sign RPMs and publish them into the rpm/ tree of a FreeMixer Pages repository

# The RPM half of a release, run in a Fedora container by the reusable build-rpm workflow on a release tag
# only: publishing a package is a release, never a side effect of a branch push. sign=false assembles an
# unsigned tree in build/repo and pushes nothing.
#
# KEY HONESTY: before signing, the imported key's fingerprint is checked against the public key the channel
# already serves dnf (rpm/RPM-GPG-KEY-freemixer in the pulled tree, else public-key-url); a mismatch
# refuses the run rather than sign with a key that gpgcheck=1 clients cannot verify. The first publish into
# an empty channel has nothing to compare with, says so, and sets the key.

inputs:
  rpm-dir:
    description: directory holding the RPMs to publish
    required: true
  tag:
    description: the release tag, for the commit message
    required: true
  sign:
    description: 'true signs and pushes; anything else assembles an unsigned tree in build/repo and pushes nothing'
    default: 'false'
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  publish-token:
    default: ''
  site-gpg-key:
    description: the SITE_GPG_KEY secret, armored; signs the channel commit
    default: ''
  channel:
    description: the channel repository
    default: FreeMixer/freemixer.github.io
  branch:
    default: main
  public-key-url:
    description: where dnf fetches the public key from, when the channel tree does not hold it yet; empty skips that comparison
    default: ''
  base-url:
    description: where the channel is served, for the .repo file
    default: https://freemixer.github.io
  signed-dir:
    description: directory receiving the signed copies of the published packages
    default: signed

runs:
  using: composite
  steps:
    - name: Install the packaging tools
      shell: bash
      run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl

    - name: Prove the packages are there before anything signs them
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
      run: |
        set -o pipefail
        find "$RPM_DIR" -name '*.rpm' | sort | tee /tmp/collected.txt
        test -s /tmp/collected.txt || { echo "::error::no RPM under $RPM_DIR"; exit 1; }

    - uses: FreeMixer/.github/.github/actions/import-gpg-key@main
      if: inputs.sign == 'true'
      with:
        gpg-key: ${{ inputs.gpg-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}

    - uses: FreeMixer/.github/.github/actions/channel-pull@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}

    - name: Check the signing key is the one the channel serves
      if: inputs.sign == 'true'
      shell: bash
      env:
        PUBLIC_KEY_URL: ${{ inputs.public-key-url }}
      run: |
        set -o pipefail
        fpr() { gpg --batch --with-colons --dry-run --import-options import-show --import 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}'; }
        if [ -s build/channel/rpm/RPM-GPG-KEY-freemixer ]; then
          PUB_FPR=$(fpr < build/channel/rpm/RPM-GPG-KEY-freemixer)
        elif [ -n "$PUBLIC_KEY_URL" ]; then
          PUB_FPR=$(curl -fsSL "$PUBLIC_KEY_URL" | fpr)
        else
          echo "::warning::the channel holds no rpm public key yet: this publish sets it to $FREEMIXER_GPG_KEY_ID"
          exit 0
        fi
        test -n "$PUB_FPR" || { echo "::error::no fingerprint readable from the channel's public key"; exit 1; }
        if [ "$PUB_FPR" != "$FREEMIXER_GPG_KEY_ID" ]; then
          echo "::error::RPM_GPG_KEY ($FREEMIXER_GPG_KEY_ID) is not the key the channel serves ($PUB_FPR) -- refusing to sign"
          exit 1
        fi

    - name: Assemble the tree
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/channel/rpm "$RPM_DIR" "$FREEMIXER_GPG_KEY_ID"
        else
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/repo/rpm "$RPM_DIR"
        fi

    - name: Prove the tree holds packages and metadata
      shell: bash
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then tree=build/channel/rpm; else tree=build/repo/rpm; fi
        find "$tree" -name '*.rpm' | sort
        test -n "$(find "$tree" -name '*.rpm' -print -quit)" || { echo "::error::the tree holds no package"; exit 1; }
        test -n "$(find "$tree" -name repomd.xml -print -quit)" || { echo "::error::no repodata in the tree"; exit 1; }
        if [ "$SIGN" = true ]; then
          test -n "$(find "$tree" -name repomd.xml.asc -print -quit)" || { echo "::error::repodata is not signed"; exit 1; }
        fi

    - name: Write the dnf repo file and keep the signed copies
      if: inputs.sign == 'true'
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
        BASE_URL: ${{ inputs.base-url }}
        SIGNED_DIR: ${{ inputs.signed-dir }}
      run: |
        set -euo pipefail
        printf '%s\n' '[freemixer]' 'name=FreeMixer' \
          "baseurl=$BASE_URL/rpm/fedora/\$releasever/\$basearch/" \
          'enabled=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
          "gpgkey=$BASE_URL/rpm/RPM-GPG-KEY-freemixer" '' \
          '[freemixer-noarch]' 'name=FreeMixer (noarch)' \
          "baseurl=$BASE_URL/rpm/fedora/\$releasever/noarch/" \
          'enabled=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
          "gpgkey=$BASE_URL/rpm/RPM-GPG-KEY-freemixer" > build/channel/rpm/freemixer.repo
        cat build/channel/rpm/freemixer.repo
        mkdir -p "$SIGNED_DIR"
        while IFS= read -r f; do
          found=$(find build/channel/rpm -name "$(basename "$f")" -print -quit)
          test -n "$found" || { echo "::error::$(basename "$f") is not in the tree"; exit 1; }
          cp "$found" "$SIGNED_DIR/"
        done < <(find "$RPM_DIR" -name '*.rpm' | sort)
        ls "$SIGNED_DIR"

    - uses: FreeMixer/.github/.github/actions/channel-push@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        site-gpg-key: ${{ inputs.site-gpg-key }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}
        tag: ${{ inputs.tag }}
        what: rpm
