name: publish-debs
description: Sign DEBs and publish them into the deb/ tree of a FreeMixer Pages repository

# The DEB half of a release, run in a Debian container by the reusable build-deb workflow on a release tag
# only. The tree is one flat apt repository per Debian release, deb/debian/<suite>/, holding <arch>/*.deb,
# Packages, Release, InRelease and Release.gpg; users point apt at it with `deb [signed-by=...] <url> ./`.
# The key is the one that signs the RPMs. sign=false assembles an unsigned tree in build/repo and pushes
# nothing. The shared-tree race is described in channel-pull.

inputs:
  deb-dir:
    description: directory holding <suite>/*.deb
    required: true
  tag:
    description: the release tag, for the commit message
    required: true
  sign:
    description: 'true signs and pushes; anything else assembles an unsigned tree in build/repo and pushes nothing'
    default: 'false'
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  publish-token:
    default: ''
  site-gpg-key:
    description: the SITE_GPG_KEY secret, armored; signs the channel commit
    default: ''
  channel:
    default: FreeMixer/freemixer.github.io
  branch:
    default: main
  requires:
    description: packages the tree must already serve, for every suite and architecture published here, space separated
    default: ''
  signed-dir:
    description: directory receiving the published copies, laid out <suite>/*.deb
    default: signed

runs:
  using: composite
  steps:
    - name: Install the packaging tools
      shell: bash
      run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg git curl ca-certificates findutils dpkg-dev

    - name: Prove the packages are there before anything signs them
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
      run: |
        set -o pipefail
        find "$DEB_DIR" -name '*.deb' | sort | tee /tmp/collected.txt
        test -s /tmp/collected.txt || { echo "::error::no DEB under $DEB_DIR"; exit 1; }

    - uses: FreeMixer/.github/.github/actions/import-gpg-key@main
      if: inputs.sign == 'true'
      with:
        gpg-key: ${{ inputs.gpg-key }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}

    - uses: FreeMixer/.github/.github/actions/channel-pull@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}

    - name: Check the signing key is the one the channel serves
      if: inputs.sign == 'true'
      shell: bash
      run: |
        set -o pipefail
        if [ ! -s build/channel/deb/freemixer.asc ]; then
          echo "::warning::the channel holds no apt public key yet: this publish sets it to $FREEMIXER_GPG_KEY_ID"
          exit 0
        fi
        PUB_FPR=$(gpg --batch --with-colons --dry-run --import-options import-show --import < build/channel/deb/freemixer.asc 2>/dev/null \
          | awk -F: '/^fpr:/ {print $10; exit}')
        test -n "$PUB_FPR" || { echo "::error::no fingerprint readable from the channel's apt key"; exit 1; }
        if [ "$PUB_FPR" != "$FREEMIXER_GPG_KEY_ID" ]; then
          echo "::error::RPM_GPG_KEY ($FREEMIXER_GPG_KEY_ID) is not the key the channel serves ($PUB_FPR) -- refusing to sign"
          exit 1
        fi

    - name: Assemble the tree
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
        SIGN: ${{ inputs.sign }}
        # only a publish is held to what the channel serves; a dry run has no channel tree to ask
        REQUIRES: ${{ inputs.sign == 'true' && inputs.requires || '' }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/channel/deb "$DEB_DIR" "$FREEMIXER_GPG_KEY_ID"
        else
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/repo/deb "$DEB_DIR"
        fi

    - name: Prove the tree holds packages and an index
      shell: bash
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then tree=build/channel/deb; else tree=build/repo/deb; fi
        find "$tree" -name '*.deb' | sort
        test -n "$(find "$tree" -name '*.deb' -print -quit)" || { echo "::error::the tree holds no package"; exit 1; }
        test -n "$(find "$tree" -name Packages -print -quit)" || { echo "::error::no index in the tree"; exit 1; }
        if [ "$SIGN" = true ]; then
          test -n "$(find "$tree" -name InRelease -print -quit)" || { echo "::error::the index is not signed"; exit 1; }
          test -s "$tree/freemixer.asc" || { echo "::error::no public key in the tree"; exit 1; }
        fi

    - name: Keep the published copies
      if: inputs.sign == 'true'
      shell: bash
      env:
        DEB_DIR: ${{ inputs.deb-dir }}
        SIGNED_DIR: ${{ inputs.signed-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$SIGNED_DIR"
        while IFS= read -r f; do
          found=$(find build/channel/deb -name "$(basename "$f")" -print -quit)
          test -n "$found" || { echo "::error::$(basename "$f") is not in the tree"; exit 1; }
          cp "$found" "$SIGNED_DIR/"
        done < <(find "$DEB_DIR" -name '*.deb' | sort)
        ls "$SIGNED_DIR"

    - uses: FreeMixer/.github/.github/actions/channel-push@main
      if: inputs.sign == 'true'
      with:
        publish-token: ${{ inputs.publish-token }}
        site-gpg-key: ${{ inputs.site-gpg-key }}
        channel: ${{ inputs.channel }}
        branch: ${{ inputs.branch }}
        tag: ${{ inputs.tag }}
        what: deb
