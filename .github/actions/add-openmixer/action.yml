name: add-openmixer
description: Add the OpenMixer repository to a Fedora or Debian container by installing openmixer-release from the channel

# What a machine does to use the channel, and nothing else: install the openmixer-release package the channel
# serves at its stable name (rpm/openmixer-release.noarch.rpm, deb/openmixer-release.deb) and refresh the
# repository it adds (dnf: openmixer and openmixer-noarch; apt: /etc/apt/sources.list.d/openmixer.sources).
# With suite set on Debian, the key and the source of that release are installed without the package (for an Ubuntu).
# Installs curl on Debian when the container lacks it; dnf installs the package from its URL. Runs as root.

inputs:
  base-url:
    description: where the channel is served
    default: https://www.openmixer.org
  suite:
    description: Debian release whose index a system the channel does not serve (an Ubuntu) takes; empty installs the release package as it is
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        SUITE: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        if command -v dnf >/dev/null; then
          grep -qx 'retries=10' /etc/dnf/dnf.conf || echo 'retries=10' >> /etc/dnf/dnf.conf
          dnf install -y --setopt=install_weak_deps=False "$BASE_URL/rpm/openmixer-release.noarch.rpm"
          # a repository that does not load is skipped by default; here it fails the step
          dnf -y --setopt=skip_if_unavailable=False makecache --repo openmixer --repo openmixer-noarch
        else
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80openmixer-retries
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates; }
          dir=$(mktemp -d)
          chmod 755 "$dir" # apt reads a local package as _apt
          deb=$dir/openmixer-release.deb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o "$deb" "$BASE_URL/deb/openmixer-release.deb"
          if [ -n "$SUITE" ]; then
            # a system the channel does not serve: the package refuses it, so take its key and the source of $SUITE
            dpkg-deb -x "$deb" "$dir/pkg"
            install -D -m 644 "$dir/pkg/usr/share/keyrings/openmixer-archive-keyring.asc" /usr/share/keyrings/openmixer-archive-keyring.asc
            install -D -m 644 "$dir/pkg/usr/share/openmixer-release/openmixer-$SUITE.sources" /etc/apt/sources.list.d/openmixer.sources
          else
            apt-get install -y --no-install-recommends "$deb"
          fi
          apt-get update -qq
        fi
