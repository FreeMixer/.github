name: commit-message-check (old path)
description: Forwards to commit-message-check; kept for one release while the consumers move to the new path

inputs:
  base-ref:
    description: the branch the pull request targets
    default: ${{ github.base_ref }}

runs:
  using: composite
  steps:
    - uses: FreeMixer/.github/.github/actions/commit-message-check@main
      with:
        base-ref: ${{ inputs.base-ref }}
