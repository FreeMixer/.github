name: release-preflight
description: Say whether a run is a release or a dry run, and refuse a release that cannot publish

# Used by the build-rpm and build-deb workflows before any build minutes are spent. A release is a publish
# requested on a tag; anything else is a dry run and needs nothing.

inputs:
  publish:
    description: whether the caller asked to publish
    required: true
  target:
    description: the Pages repository that receives the packages
    required: true
  tag:
    description: the tag being released when the run is not on that tag (a release of another repository); empty means the tag of the run
    default: ''
  require-tag:
    description: a release is a publish on a tag; 'false' lets a workflow that publishes from a branch use this check
    default: 'true'
  packages:
    description: >-
      the binary package names the release builds, space separated (globs allowed); the release is refused when
      the target already serves one of them at the version the tag names. Empty skips that check.
    default: ''
  kind:
    description: >-
      'rpm' or 'deb': the package kind this release publishes; the already-served check reads only that half of the
      channel, so the deb job of a release is not refused by the rpms its own rpm job published a minute earlier.
      Empty reads both.
    default: ''
  releases:
    description: >-
      the Fedora releases (rpm) or Debian suites (deb) this release publishes into, space separated; the
      already-served check reads only those trees, so a version served for fc44 does not refuse its first fc45
      publish. Empty reads every release.
    default: ''
  republish:
    description: "'true' lets a release go out again over a version the channel already serves (a rerun that must finish a partial publish)"
    default: 'false'
  gpg-key:
    default: ''
  gpg-passphrase:
    default: ''
  pages-token:
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        TARGET: ${{ inputs.target }}
        GPG_KEY: ${{ inputs.gpg-key }}
        PAGES_TOKEN: ${{ inputs.pages-token }}
        REF: ${{ github.ref }}
        REF_TYPE: ${{ inputs.tag != '' && 'tag' || github.ref_type }}
        REQUIRE_TAG: ${{ inputs.require-tag }}
        TAG: ${{ inputs.tag || github.ref_name }}
        PACKAGES: ${{ inputs.packages }}
        REPUBLISH: ${{ inputs.republish }}
        KIND: ${{ inputs.kind }}
        RELEASES: ${{ inputs.releases }}
      run: |
        set -euo pipefail
        if [ "$PUBLISH" != true ] || { [ "$REQUIRE_TAG" = true ] && [ "$REF_TYPE" != tag ]; }; then
          echo "::notice::dry run ($REF): the packages are built and an unsigned tree is assembled; nothing is signed or published"
          exit 0
        fi
        echo "::notice::release of $TAG: sign and publish to $TARGET"

        # a work marker becoming the published version cannot be undone: rpm and dpkg have no downgrade
        if [ "$REQUIRE_TAG" = true ]; then
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' does not match v[0-9]*"; exit 1 ;;
          esac
        fi

        missing=
        # the passphrase is not checked: the packages key is exported without one
        [ -n "$GPG_KEY" ] || missing="$missing signing-key"
        [ -n "$PAGES_TOKEN" ] || missing="$missing PAGES_TOKEN"
        if [ -n "$missing" ]; then
          echo "::error::missing secrets:$missing -- create them as FreeMixer organisation secrets shared with this repository"
          exit 1
        fi

        status=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/target.json -w '%{http_code}' \
          -H "Authorization: Bearer $PAGES_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$TARGET")
        if [ "$status" != 200 ]; then
          echo "::error::the target repository $TARGET answered HTTP $status. It must exist, and PAGES_TOKEN must reach it with contents:write. Create it (public, GitHub Pages enabled) or pass another target-repo; this workflow never creates it."
          exit 1
        fi
        push=$(jq -r '.permissions.push // "unknown"' /tmp/target.json)
        [ "$push" != false ] || { echo "::error::PAGES_TOKEN cannot push to $TARGET (contents:write is missing)"; exit 1; }
        echo "target $TARGET: $(jq -r '.visibility' /tmp/target.json), default branch $(jq -r '.default_branch' /tmp/target.json)"

        # Moving old tags (a history rewrite) re-runs their release workflows. A version the channel already serves
        # is never published again: the same NEVRA / deb version would be refused by dnf and apt, or worse, replaced.
        if [ "$REQUIRE_TAG" = true ] && [ -n "$PACKAGES" ] && [ "$REPUBLISH" != true ]; then
          code=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/tree.json -w '%{http_code}' \
            -H "Authorization: Bearer $PAGES_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET/git/trees/HEAD?recursive=1")
          [ "$code" = 200 ] || { echo "::error::the tree of $TARGET answered HTTP $code; cannot tell whether $TAG is already served"; exit 1; }
          [ "$(jq -r '.truncated' /tmp/tree.json)" != true ] || echo "::warning::the tree of $TARGET is truncated; the already-served check is partial"
          jq -r '.tree[].path' /tmp/tree.json | "$GITHUB_ACTION_PATH/already-served.sh" "$TAG" $PACKAGES
        fi
