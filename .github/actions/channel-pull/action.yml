name: channel-pull
description: Clone the channel repository into build/channel, with its dnf metadata discarded

# THE SHARED-TREE RACE: several repositories commit to the same branch of the channel repository, and
# GitHub's concurrency groups are scoped per repository, so nothing here can serialise against another
# repository's run. The mitigation is structural: `git push` refuses a non-fast-forward, so a race loses to
# that refusal rather than corrupting the tree, and the tree scripts place files by name (an identical
# package is a no-op, a new one is added, nothing already there is removed), so a re-run after a refusal is
# safe. Publish one release, wait for it to land, publish the next.
#
# Assembling into an empty directory would describe this run's packages alone, and the push would replace
# the tree's metadata with it: every other package stays in git and vanishes from the package manager. The
# pulled dnf metadata is discarded so the tree script regenerates it from the bytes the tree holds.

inputs:
  publish-token:
    description: token with contents write on the channel repository (the PAGES_TOKEN secret)
    required: true
  channel:
    required: true
  branch:
    default: main

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
        CHANNEL: ${{ inputs.channel }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -o pipefail
        test -n "$PUBLISH_TOKEN" || {
          echo "::error::PAGES_TOKEN is not set -- add a token with contents:write on $CHANNEL as an organisation or repository secret"
          exit 1
        }
        auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
          clone --depth 1 "https://github.com/$CHANNEL.git" build/channel
        git -C build/channel checkout -q -B "$BRANCH"
        mkdir -p build/channel/rpm build/channel/deb
        find build/channel/rpm -type d -name repodata -prune -exec rm -rf {} +
        echo "pulled $(find build/channel/rpm -name '*.rpm' | wc -l) rpm and $(find build/channel/deb -name '*.deb' | wc -l) deb package(s) from $CHANNEL"
