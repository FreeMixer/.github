name: install-clean
description: Install RPMs, with their dependencies from the distribution, into an empty root

# A clean container within the job's container: only what the packages pull in is in the root, so a
# dependency the spec forgot to declare is missing there. Run commands in it with `chroot <root>`.
# Needs the container options of the jack tests (--cap-add SYS_ADMIN, systempaths=unconfined) to mount
# /proc and /dev into the root.

inputs:
  rpms:
    description: RPM files or globs, one per line
    required: true
  packages:
    description: distribution packages installed beside them, space separated
    default: ''
  root:
    description: the root
    default: /tmp/clean-root

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RPMS: ${{ inputs.rpms }}
        PACKAGES: ${{ inputs.packages }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        mkdir -p "$ROOT"
        files=()
        while IFS= read -r glob; do
          [ -n "$glob" ] || continue
          matched=($glob)
          [ -e "${matched[0]}" ] || { echo "::error::no file matches $glob"; exit 1; }
          files+=("${matched[@]}")
        done <<< "$RPMS"
        # A mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again, three attempts with a pause.
        # dnf's exit status is the only thing that decides: nothing is hidden, each attempt prints, and the third
        # failure fails the step with dnf's own output as the last thing on the log.
        for attempt in 1 2 3; do
          if dnf install -y --installroot="$ROOT" --use-host-config --releasever="$(rpm -E %fedora)" \
              --setopt=install_weak_deps=False --setopt=retries=5 "${files[@]}" $PACKAGES; then
            break
          fi
          [ "$attempt" -lt 3 ] || exit 1
          echo "::warning::dnf install failed, attempt $attempt of 3"
          sleep "${INSTALL_RETRY_SLEEP:-15}"
        done
        mount -t proc proc "$ROOT/proc"
        mount --rbind /dev "$ROOT/dev"
