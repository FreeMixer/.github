name: changelog
description: Write the release notes of a tag from the git history since the previous tag

# Git history is the changelog; no CHANGELOG.md is kept (docs/packaging-changelog.md). mode notes writes the
# commit subjects between the previous tag and the tag as the GitHub release notes. The caller has checked
# the repository out with fetch-depth: 0 so the tags and history are there. The old mode check (CHANGELOG.md
# against the spec and debian/changelog) is gone and refuses with an error.

inputs:
  mode:
    description: notes (check is gone)
    default: notes
  tree:
    description: the checkout
    default: .
  tag:
    description: release tag; empty means HEAD
    default: ''
  spec:
    description: ignored, kept so existing callers still validate
    default: ''
  notes-file:
    description: where the release notes are written
    default: release-notes.md

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TREE: ${{ inputs.tree }}
        TAG: ${{ inputs.tag }}
        NOTES: ${{ inputs.notes-file }}
      run: |
        set -euo pipefail
        case "$MODE" in
          notes)
            "$GITHUB_ACTION_PATH/changelog.sh" notes -C "$TREE" "${TAG:-HEAD}" > "$NOTES"
            cat "$NOTES"
            ;;
          *) echo "::error::mode is notes, not $MODE: the CHANGELOG.md check was removed, git history is the changelog"; exit 1 ;;
        esac
