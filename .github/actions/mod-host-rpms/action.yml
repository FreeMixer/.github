name: mod-host-rpms
description: Build the mod-host, mod-host-protocol and mod-host-protocol-devel RPMs and install them

# What a host repository's RPM build needs for BuildRequires: pkgconfig(mod-host-protocol), and for
# a smoke test the mod-host binary itself. Built from packaging/mod-host, the audinux spec with the
# upstream pull requests it carries (docs/mod-host-carried-patches.md). The installed library is then
# checked for mod-audio/mod-host#113: a package without it fails here. Runs in a Fedora container as root.

inputs:
  out:
    description: directory the RPMs are copied to
    default: mod-host-rpms
  release:
    description: Release of the built packages, without the dist tag; empty keeps the spec's
    default: ''
  suffix:
    description: appended to the Release after a dot, before the dist tag (the channel passes fmx); empty keeps the spec's Release
    default: ''

runs:
  using: composite
  steps:
    - name: Build the mod-host RPMs
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        RELEASE: ${{ inputs.release }}
        SUFFIX: ${{ inputs.suffix }}
      run: '"$GITHUB_ACTION_PATH/build.sh" "$OUT"'

    - name: Install mod-host and its protocol library
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        dnf install -y --setopt=install_weak_deps=False "$OUT"/mod-host-[0-9]*.rpm "$OUT"/mod-host-protocol-[0-9]*.rpm \
          "$OUT"/mod-host-protocol-devel-*.rpm
        pkg-config --modversion mod-host-protocol

    # the exact-1024-byte command and the framing of mod-audio/mod-host#113, against the installed package
    - name: Check the installed library splits commands at their NUL
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../packaging/mod-host/framing-test.sh"'
