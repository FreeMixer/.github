name: mod-host-rpms
description: Build the mod-host, mod-host-protocol and mod-host-protocol-devel RPMs and install them

# What a host repository's RPM build needs for BuildRequires: pkgconfig(mod-host-protocol), and for a smoke test
# the mod-host binary itself. Built by the fork's own packaging/mod-host.spec at the commit .github/pins.txt
# names (actions/mod-host-protocol/fetch-source.sh), the source the published packages come from. The installed
# library is then checked by actions/mod-host-protocol/checks/framing-test.sh. Runs in a Fedora container as root.

inputs:
  out:
    description: directory the RPMs are copied to; the source package the binaries were built from is kept in SRPMS/ under it
    default: mod-host-rpms

runs:
  using: composite
  steps:
    - name: Build the mod-host RPMs
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: '"$GITHUB_ACTION_PATH/build.sh" "$OUT"'

    - name: Install mod-host and its protocol library
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        dnf install -y --setopt=install_weak_deps=False "$OUT"/mod-host-[0-9]*.rpm "$OUT"/mod-host-protocol-[0-9]*.rpm \
          "$OUT"/mod-host-protocol-devel-*.rpm
        pkg-config --modversion mod-host-protocol

    - name: Check the installed library
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../mod-host-protocol/checks/framing-test.sh"'
