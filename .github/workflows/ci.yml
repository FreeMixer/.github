name: ci

# The publish scripts and the key import, exercised the way a release uses them, with throwaway keys: a
# channel signed by one key, a second key served next to it, a publish signed by the second key, and a
# client that only ever held the first (tests/key-transition.sh). The changelog generator (from git), and
# what the channel publish adds from them: an updateinfo.xml for dnf and a Changelogs URL for apt
# (docs/packaging-changelog.md). The mod-host packages of packaging/mod-host: the patches apply and their tests
# pass, each fix taken out again fails its check, and the RPMs and DEBs carry mod-audio/mod-host#113 and sort
# where docs/mod-host-carried-patches.md says.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-message-check:
    name: commit-message-check action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: tests/commit-message-check.sh
      - run: tests/preamble-actions.sh
      - run: tests/install-clean-retry.sh
      - name: The action reads this pull request's own commits
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/commit-message-check

  key-transition:
    name: Key transition (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            image: fedora:44
            tools: dnf install -y --setopt=install_weak_deps=False rpm-build rpm-sign createrepo_c python3-rpm gnupg2 pinentry findutils
          - kind: deb
            image: debian:trixie
            tools: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils gnupg gpgv dpkg-dev
    steps:
      - name: Install the packaging tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@v4

      - name: Make two throwaway keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          tests/make-keys.sh "$RUNNER_TEMP/keys"
          for k in old new; do
            { echo "$k<<EOF_KEY"; cat "$RUNNER_TEMP/keys/$k.sec"; echo EOF_KEY; } >> "$GITHUB_OUTPUT"
          done

      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ steps.keys.outputs.new }}
          id-variable: NEW_ID

      - uses: ./.github/actions/import-gpg-key
        with:
          gpg-key: ${{ steps.keys.outputs.old }}
          gpg-passphrase: old-pass
          id-variable: OLD_ID

      - name: Publish across the key change
        shell: bash
        run: tests/key-transition.sh ${{ matrix.kind }}

  changelog:
    name: changelog generator from git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tests/changelog.sh

  updateinfo:
    name: dnf updateinfo from the packages' changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False rpm-build createrepo_c python3-rpm dnf5 findutils
      - uses: actions/checkout@v4
      - run: tests/updateinfo.sh
      - run: tests/srpm-publish.sh

  deb-changelog:
    name: apt changelog from the published tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends apt-utils dpkg-dev debhelper build-essential python3 apt ca-certificates
      - uses: actions/checkout@v4
      - run: tests/deb-changelog.sh

  channel-push-race:
    name: channel push survives a lost race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c 'import yaml' || sudo apt-get install -y python3-yaml
      - run: tests/channel-push-race.sh

  mod-host-carried:
    name: mod-host carried patches, then each fix taken out again
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc make python3 pkgconf-pkg-config libasan diffutils
      - uses: actions/checkout@v4
      - run: tests/mod-host-carried.sh

  mod-host-rpm:
    name: mod-host RPMs from packaging/mod-host, and where they sort
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@v4

      # builds, installs and runs packaging/mod-host/framing-test.sh against the installed package
      - uses: ./.github/actions/mod-host-rpms
        with:
          suffix: omx

      # above the channel's earlier fmx builds (11.1.fmx is the same code, which this build upgrades) and audinux's
      # build without the patches, below audinux's build with them, and the floor plugin-hostd requires is met by
      # this build, by 11.1.fmx and by audinux's 12, by neither of the others
      - name: The release sorts between audinux's builds without and with the patches
        run: |
          set -euo pipefail
          evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' mod-host-rpms/mod-host-protocol-[0-9]*.rpm)
          v=${evr%%-*}
          echo "built $evr"
          case "$evr" in "$v-11.1.omx.fc44") ;; *) echo "::error::$evr is not $v-11.1.omx.fc44"; exit 1 ;; esac
          cmp() { rpm --eval "%{lua: print(rpm.vercmp('$1', '$2'))}"; }
          fail=0
          for pair in "$evr $v-11.1.fmx.fc44 1" "$evr $v-11.fmx.fc44 1" "$evr $v-11.fc44 1" "$evr $v-12.fc44 -1" \
                      "$evr $v-11.1 1" "$v-12.fc44 $v-11.1 1" "$v-11.1.fmx.fc44 $v-11.1 1" \
                      "$v-11.fmx.fc44 $v-11.1 -1" "$v-11.fc44 $v-11.1 -1"; do
            set -- $pair
            got=$(cmp "$1" "$2")
            if [ "$got" = "$3" ]; then echo "ok      vercmp $1 $2 = $3"; else echo "::error::vercmp $1 $2 is $got, not $3"; fail=1; fi
          done
          exit $fail

  mod-host-deb:
    name: mod-host-protocol DEBs from packaging/mod-host, and where they sort
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      # builds, lints, installs and runs packaging/mod-host/framing-test.sh against the installed package
      - uses: ./.github/actions/deb-deps
        with:
          names: mod-host-protocol

      - name: The release sorts above the last published build, and meets the floor plugin-hostd depends on
        run: |
          set -euo pipefail
          ver=$(dpkg-query -W -f='${Version}' libmod-host-protocol0)
          echo "built $ver"
          dpkg --compare-versions "$ver" gt 0.1.0-5
          dpkg --compare-versions "$ver" eq 0.1.0-6~omx
          dpkg --compare-versions "$ver" gt 0.1.0-6~fmx
          dpkg --compare-versions "$ver" ge 0.1.0-6~fmx
          dpkg --compare-versions "$ver" lt 0.1.0-6
          dpkg --compare-versions 0.1.0-5 lt 0.1.0-6~fmx

  # The two checks every repository runs from here: dependency floors from one packaging/deps.txt, and no
  # tracked file pointing into a private repository. Each action proves its engine red on every planted drift
  # before it reads the tree it is given (this one, which declares neither and so is the clean control).
  repo-checks:
    name: deps-render and private-refs-check engines, sabotaged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/actions/deps-render/render.sh --self-test
      - uses: ./.github/actions/private-refs-check
