name: fuzz
# The caller's libFuzzer harnesses, built with clang, ASan and UBSan in a distribution container, then run.
#
#   jobs:
#     fuzz:
#       uses: FreeMixer/.github/.github/workflows/fuzz.yml@v1
#       with:
#         build: make fuzz-build
#         run: make fuzz FUZZ_TIME=60
on:
  workflow_call:
    inputs:
      build:
        description: the command that builds the harnesses
        type: string
        required: true
      run:
        description: the command that runs them (and their sabotage arms)
        type: string
        required: true
      tools:
        type: string
        default: dnf install -y --setopt=install_weak_deps=False git dnf5-plugins clang compiler-rt llvm make gawk diffutils python3 pkgconf-pkg-config
      image:
        type: string
        default: fedora:44
      channel:
        type: boolean
        default: false
      channel-packages:
        type: string
        default: ''
      runs-on:
        description: the runner; a pull request from a fork always runs on ubuntu-latest, whatever is passed here
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  fuzz:
    name: fuzz
    runs-on: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.image }}
    steps:
      - name: clang, libFuzzer and llvm-cov
        shell: sh
        run: ${{ inputs.tools }}
      - uses: actions/checkout@v4
      - name: The checkout is a git directory this job may read
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - if: inputs.channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - if: inputs.channel-packages != ''
        name: What the build takes from the channel
        run: ${{ inputs.channel-packages }}
      - name: Build the harnesses
        run: ${{ inputs.build }}
      - name: Run them
        run: ${{ inputs.run }}
