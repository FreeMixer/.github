name: Build DEB (reusable)

# The Debian half of the release path of build-rpm.yml, for Raspberry Pi OS and Zynthian (Debian bookworm,
# arm64), Debian trixie and amd64. Called from the same thin workflow, on the same v* tag:
#
#   jobs:
#     deb:
#       uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
#       with: { package-name: plugin-hostd }
#       secrets: inherit
#
# A tag builds the DEBs on every Debian release and architecture of the matrix (each on a runner of its own
# architecture, in a debian: container), runs lintian, signs the apt index and publishes into deb/ of the
# target Pages repository. Anything that is not a tag is a dry run: it builds, lints and assembles an UNSIGNED
# tree as an artifact.
#
# The packaging is the debian/ directory of the calling repository; its changelog version is the version and
# must equal the packaging/*.spec Version when there is one, and the tag must be v<version>. What Debian does
# not carry, libmod-host-protocol (from packaging/mod-host) and the CLAP headers (from .github/pins.txt), is built first: the
# protocol library is published once by mod-host-protocol-deb.yml and the packages Depend on it, they never
# carry a copy; the CLAP headers are a build dependency only. A build dependency the channel already serves
# (plugin-hostd-dev) comes from the channel's apt source, added inside the build container only.
#
# Secrets (organisation secrets, passed by `secrets: inherit`): OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN,
# and the original key RPM_GPG_KEY, RPM_GPG_PASSPHRASE. The packages key signs the apt index as it signs the
# RPMs; the original key co-signs the index while apt installs may hold only it in their signed-by file.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label for the x86 jobs (a private repo passes its own runners, e.g. arc-freemixer; arm builds keep ubuntu-24.04-arm)'
      package-name:
        required: true
        type: string
        description: 'Source package name, the Source of debian/control (e.g. plugin-hostd)'
      binary-names:
        type: string
        default: ''
        description: 'Binary DEBs the build must produce, space separated names or globs (e.g. libomxdsp-dev). Empty means package-name.'
      publish:
        type: boolean
        default: false
        description: 'Sign and publish. Takes effect on a tag only; false or a branch is a dry run.'
      target-repo:
        type: string
        default: 'FreeMixer/freemixer.github.io'
        description: 'Pages repository whose deb/ tree receives the packages'
      base-url:
        type: string
        default: 'https://freemixer.github.io'
        description: 'Where the target repository is served'
      arch-matrix:
        type: string
        default: '["amd64", "arm64"]'
        description: 'JSON array of architectures, each built natively'
      suite-matrix:
        type: string
        default: '["bookworm", "trixie"]'
        description: 'JSON array of Debian releases (bookworm is Raspberry Pi OS and Zynthian)'
      dependencies:
        type: string
        default: 'mod-host-protocol clap-headers'
        description: 'What to build first (actions/deb-deps), space separated'
      requires:
        type: string
        default: 'libmod-host-protocol0'
        description: 'Packages the apt tree must already serve before this one is published'
      build-packages:
        type: string
        default: ''
        description: 'Extra distribution packages installed before the build, space separated'
      channel-deps:
        type: boolean
        default: true
        description: 'Take Build-Depends Debian does not carry (plugin-hostd-dev) from the channel at base-url'
      changelog-spec:
        type: string
        default: ''
        description: 'Ignored, kept so existing callers still validate: no CHANGELOG.md check remains'
      source-repository:
        type: string
        default: ''
        description: 'Repository to build when it is not the caller (a release dispatched from another repository); empty means the caller'
      source-ref:
        type: string
        default: ''
        description: 'Tag of source-repository to build and release, v<version>; empty means the tag the caller was run on'
      source-sha:
        description: 'With source-ref: the commit that tag must resolve to; each checkout is asserted against it. Empty skips the check.'
        required: false
        type: string
        default: ''
      create-github-release:
        type: boolean
        default: true
        description: 'Attach the DEBs, named by Debian release, to the GitHub release of the tag'
      verify-install:
        type: boolean
        default: true
        description: 'After a publish, install the new version from the channel in a clean container of each release. false skips the check: the release is then not proven installable, and the worker image dispatch goes out on the publish alone.'
      dispatch-repo:
        type: string
        default: 'zerosignage/platform'
        description: 'Repository whose worker image build is told about the new packages by a repository_dispatch; empty sends nothing'
      dispatch-event:
        type: string
        default: 'freemixer-package-published'
        description: 'event_type of that repository_dispatch; the worker image build listens for it (client_payload: package, tag, format)'
    secrets:
      DISPATCH_TOKEN:
        required: false
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      RPM_GPG_KEY:
        required: false
      RPM_GPG_PASSPHRASE:
        required: false
      PAGES_TOKEN:
        required: false
      SITE_GPG_KEY:
        required: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      # git history is the changelog: nothing here reads a CHANGELOG.md
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != ''
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      - uses: FreeMixer/.github/.github/actions/release-preflight@v1
        with:
          publish: ${{ inputs.publish }}
          tag: ${{ inputs.source-ref }}
          target: ${{ inputs.target-repo }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || inputs.runner }}
    timeout-minutes: 45
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite-matrix) }}
        arch: ${{ fromJSON(inputs.arch-matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.source-ref || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - name: Install the build tools
        env:
          EXTRA: ${{ inputs.build-packages }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian $EXTRA

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.source-repository == '' }}

      - name: Check the checkout is the verified commit
        if: inputs.source-sha != ''
        env:
          WANT: ${{ inputs.source-sha }}
        run: |
          got=$(git -c safe.directory="$PWD" rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::the checkout is $got but the verified tag resolved to $WANT"; exit 1; }

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1
        with:
          names: ${{ inputs.dependencies }}

      # for the build only: the source exists in this container and is never a dependency of a release
      - name: Take build dependencies from the FreeMixer channel
        if: inputs.channel-deps
        env:
          URL: ${{ inputs.base-url }}/deb
          SUITE: ${{ matrix.suite }}
        run: |
          apt-get install -y --no-install-recommends curl
          install -d /etc/apt/keyrings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /etc/apt/keyrings/freemixer.asc "$URL/freemixer.asc"
          echo "deb [signed-by=/etc/apt/keyrings/freemixer.asc] $URL/debian/$SUITE ./" > /etc/apt/sources.list.d/freemixer.list
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80freemixer-retries
          apt-get -o Acquire::Retries=5 update -qq

      - uses: FreeMixer/.github/.github/actions/build-deb@v1
        with:
          tag: ${{ env.RELEASE_TAG }}

      - name: Refuse an empty build, and one of another architecture
        env:
          ARCH: ${{ matrix.arch }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
        run: |
          find debs -name '*.deb' | sort | tee built.txt
          test -s built.txt || { echo "::error::no DEB was produced"; exit 1; }
          # the binaries are named after the source package unless binary-names says otherwise
          for bin in ${BINARIES:-$NAME}; do
            bins=$(find debs \( -name "${bin}_*_$ARCH.deb" -o -name "${bin}_*_all.deb" \) | wc -l)
            [ "$bins" -gt 0 ] || { echo "::error::no $bin DEB for $ARCH"; exit 1; }
          done

      # the dependencies are built to satisfy Build-Depends; only this package is released
      - name: Lay the package out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "out/$SUITE"
          cp debs/*.deb "out/$SUITE/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:trixie
    # A dry run (publish false) pushes nothing, so it gets its own group per run.
    concurrency:
      group: publish-${{ inputs.target-repo }}-${{ inputs.publish && 'live' || github.run_id }}
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-debs-*
          merge-multiple: true
          path: collected

      - uses: FreeMixer/.github/.github/actions/publish-debs@v1
        with:
          deb-dir: collected
          tag: ${{ inputs.source-ref || github.ref_name }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          # the original key co-signs the apt index while installs may hold only it (publish-debs)
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: ${{ inputs.target-repo }}
          requires: ${{ inputs.requires }}
          changelogs-url: ${{ inputs.base-url }}/deb/changelogs

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH == 'true'
        with:
          name: ${{ inputs.package-name }}-debs-signed
          path: signed/*.deb
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: ${{ inputs.package-name }}-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30

      - name: Report a dry run honestly
        if: env.DO_PUBLISH != 'true'
        run: |
          echo "::warning::dry run: nothing was signed or published. The unsigned tree is attached to this run."

  # Runs beside build-rpm.yml's release job, which may create the release first: create it only when it
  # is absent, otherwise upload with --clobber. File names repeat across Debian releases, so the release
  # is part of the asset name.
  release:
    name: GitHub release
    needs: publish
    if: inputs.publish && inputs.create-github-release && github.ref_type == 'tag'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # the release notes are the commit subjects since the previous tag, not GitHub's list of merged pull requests
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: FreeMixer/.github/.github/actions/changelog@v1
        with:
          mode: notes
          tag: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-debs-*
          merge-multiple: true
          path: collected

      - name: Attach the DEBs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          for deb in collected/*/*.deb; do
            suite=$(basename "$(dirname "$deb")")
            base=$(basename "$deb" .deb)
            arch=${base##*_}
            cp "$deb" "assets/${base%_*}_${suite}_${arch}.deb"
          done
          ls -l assets
          test -n "$(ls assets)" || { echo "::error::no DEB to attach"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          elif gh release create "$TAG" assets/*.deb --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"; then
            :
          else
            # lost the race to the RPM job
            gh release upload "$TAG" assets/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # The last proof: the version the tag names installs from the channel, in a Debian that holds nothing else.
  # Pages serves the push a little late, so the check retries before it calls the release broken.
  verify:
    name: Install check (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [publish, release]
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.publish && inputs.verify-install && (inputs.source-ref != '' || github.ref_type == 'tag') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || inputs.runner }}
    timeout-minutes: 30
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite-matrix) }}
        arch: ${{ fromJSON(inputs.arch-matrix) }}
    steps:
      - name: Install the new version from the channel
        env:
          TAG: ${{ inputs.source-ref || github.ref_name }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
          URL: ${{ inputs.base-url }}/deb
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          ver=${TAG#v}
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates
          install -d /etc/apt/keyrings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /etc/apt/keyrings/freemixer.asc "$URL/freemixer.asc"
          echo "deb [signed-by=/etc/apt/keyrings/freemixer.asc] $URL/debian/$SUITE ./" > /etc/apt/sources.list.d/freemixer.list
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80freemixer-retries
          for bin in ${BINARIES:-$NAME}; do
            ok=
            for try in $(seq 1 20); do
              apt-get update -qq || true
              # the exact version the tag names (Debian revision and ~/+ suffixes allowed), never the newest
              pinned=$(apt-cache madison "$bin" | awk -v v="$ver" '$3 ~ "^"v"[-~+]" || $3 == v {print $3; exit}')
              if [ -n "$pinned" ] && apt-get install -y --no-install-recommends "$bin=$pinned"; then
                dpkg-query -W -f='${Package} ${Version}\n' "$bin" | tee /dev/stderr
                ok=1; break
              fi
              echo "attempt $try: $bin $ver is not installable yet"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::$bin $ver does not install from $URL in a clean debian $SUITE"; exit 1; }
          done

  # A tag that ends without packages must not be silent: the repository gets an issue naming the tag and the
  # failed jobs. A called workflow cannot raise the token of its caller: the `permissions` below only narrow it.
  # The calling release.yml must itself grant `issues: write` in its top-level `permissions:` (or on the job that
  # calls this workflow). Without it the step fails loudly with an error naming the missing permission.
  report-failure:
    name: Report a failed release
    needs: [preflight, build, publish, release, verify]
    if: ${{ always() && inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - uses: FreeMixer/.github/.github/actions/release-failure-issue@v1
        with:
          tag: ${{ inputs.source-ref || github.ref_name }}
          token: ${{ github.token }}
          workflow: build-deb

  # Last: tell the worker image build that the channel holds a new version. Nothing listens for the event yet,
  # so this job may not fail the release (continue-on-error) and says so in its notice when it has no token.
  # Token: DISPATCH_TOKEN, an organisation secret that may dispatch events to dispatch-repo. PAGES_TOKEN is
  # used only when DISPATCH_TOKEN is unset, and the notice says so: its scope is not recorded, so a 403 there
  # is expected and not a release failure. With verify-install false the install check is skipped and the
  # dispatch still goes out once the publish succeeded.
  notify-worker-image:
    name: Tell the worker image build
    needs: [publish, verify]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && inputs.publish && (inputs.source-ref != '' || github.ref_type == 'tag') && inputs.dispatch-repo != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Send the repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          TARGET: ${{ inputs.dispatch-repo }}
          EVENT: ${{ inputs.dispatch-event }}
          PACKAGE: ${{ inputs.package-name }}
          TAG: ${{ inputs.source-ref || github.ref_name }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            export GH_TOKEN="$DISPATCH_TOKEN"
          elif [ -n "$PAGES_TOKEN" ]; then
            export GH_TOKEN="$PAGES_TOKEN"
            echo "::notice::DISPATCH_TOKEN is not set; trying PAGES_TOKEN, whose scope on $TARGET is not recorded. Set DISPATCH_TOKEN to make this reliable."
          else
            echo "::notice::no DISPATCH_TOKEN (and no PAGES_TOKEN): the worker image build was not told about $PACKAGE $TAG"
            exit 0
          fi
          gh api "repos/$TARGET/dispatches" -f event_type="$EVENT" \
            -f "client_payload[package]=$PACKAGE" -f "client_payload[tag]=$TAG" -f "client_payload[format]=deb" \
            -f "client_payload[source]=$GITHUB_REPOSITORY"
          echo "sent $EVENT to $TARGET for $PACKAGE $TAG"
