name: mod-host-protocol RPMs

# Builds mod-host, mod-host-protocol, which carries libmod-host-protocol.so.0, and mod-host-protocol-devel from the fedora-spec
# pin of .github/pins.txt for every architecture and publishes them into rpm/ of the Pages repository, where
# omx-clap-host and plugin-hostd Require libmod-host-protocol.so.0, until audinux ships the library. Run by
# hand, once per pin: the packages carry RELEASE below, and a published NEVRA is never rebuilt with new bytes,
# so a moved pin needs a new RELEASE with it.
#
# publish=false, the default, is a dry run: it builds and assembles an unsigned tree as an artifact.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on the main branch publishes'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # above the published 5.1.freemixer1, below the audinux 7 that ships mod-host-protocol, so audinux replaces it
  RELEASE: 5.2.freemixer1

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ inputs.publish }}
          require-tag: 'false'
          target: FreeMixer/freemixer.github.io
          gpg-key: ${{ secrets.RPM_GPG_KEY }}
          gpg-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44']
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/mod-host-rpms
        with:
          release: ${{ env.RELEASE }}

      - name: Stage the packages and check what they carry
        env:
          ARCH: ${{ matrix.arch }}
          FEDORA: ${{ matrix.fedora }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp mod-host-rpms/mod-host-[0-9]*."$ARCH".rpm mod-host-rpms/mod-host-protocol-[0-9]*."$ARCH".rpm \
            mod-host-rpms/mod-host-protocol-devel-[0-9]*."$ARCH".rpm release/
          for f in release/*.rpm; do
            rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' "$f"
            [ "$(rpm -qp --qf '%{RELEASE}' "$f")" = "$RELEASE.fc$FEDORA" ] || { echo "::error::$f is not Release $RELEASE.fc$FEDORA"; exit 1; }
          done
          rpm -qp --provides release/mod-host-protocol-[0-9]*.rpm | grep '^libmod-host-protocol\.so\.0' \
            || { echo "::error::mod-host-protocol does not provide libmod-host-protocol.so.0"; exit 1; }
          if rpm -qp --provides release/mod-host-[0-9]*.rpm | grep '^libmod-host-protocol\.so\.0'; then
            echo "::error::mod-host still provides libmod-host-protocol.so.0"; exit 1
          fi
          rpm -qp --requires release/mod-host-[0-9]*.rpm | grep '^mod-host-protocol(' \
            || { echo "::error::mod-host does not require mod-host-protocol"; exit 1; }
          rpm -qp --provides release/mod-host-protocol-devel-*.rpm | grep '^pkgconfig(mod-host-protocol)' \
            || { echo "::error::mod-host-protocol-devel does not provide pkgconfig(mod-host-protocol)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mod-host-rpms-fc${{ matrix.fedora }}-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    concurrency:
      group: publish-FreeMixer/freemixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mod-host-rpms-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-rpms
        with:
          rpm-dir: collected
          tag: mod-host-${{ env.RELEASE }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.RPM_GPG_KEY }}
          gpg-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: mod-host-unsigned-rpm-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30
