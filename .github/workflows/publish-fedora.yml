name: Publish a release for more Fedora releases

# Builds and publishes the RPMs of a tag that is already released, for the Fedora releases named here only: a new
# Fedora release gets the packages the channel serves for the others, at the same version and signed the same way,
# without a version bump. The tag is checked out at the commit its signed annotated tag names and built by the same
# build-rpm.yml the repository's own release.yml calls, with the inputs that release.yml passes (the table below).
#
# Only the RPMs of the named releases are built, so nothing already served is published again; the release preflight
# reads only those releases' trees and refuses a version one of them already holds. The GitHub release of the tag is
# not touched. publish=false (the default) is a dry run that builds everything and publishes nothing; publish=true is
# taken only on main.
#
# ORDER: dependencies first. A build takes its BuildRequires from the channel's tree of its own Fedora release, so a
# package is published for a release only after what it builds against is served there (omx-contract first).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository whose tag is published'
        required: true
        type: choice
        options:
          - FreeMixer/omx-contract
          - FreeMixer/libdiginet
          - FreeMixer/libmackie
          - FreeMixer/libsurface
          - FreeMixer/plugin-db
          - FreeMixer/plugin-hostd-protocol
          - FreeMixer/omx-dsp
          - FreeMixer/omx-clap-core
          - FreeMixer/plugin-hostd
          - FreeMixer/plugin-qualify
          - FreeMixer/omx-panel
          - FreeMixer/omx-plugins
          - FreeMixer/omx-qualification-records
          - FreeREAC/libreac
          - FreeREAC/reac-pw
          - FreeREAC/reac-stageboxes
      tag:
        description: 'Release tag, v<version>; it must already exist in the repository'
        required: true
        type: string
      fedora-versions:
        description: 'JSON array of the Fedora releases to build and publish for, e.g. ["45"]'
        required: true
        type: string
        default: '["45"]'
      publish:
        description: 'Sign and publish to the channel. Off is a dry run that publishes nothing.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Check the tag, choose the build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.pick.outputs.package }}
      binaries: ${{ steps.pick.outputs.binaries }}
      needs-mod-host: ${{ steps.pick.outputs.needs-mod-host }}
      channel-deps: ${{ steps.pick.outputs.channel-deps }}
      arch-matrix: ${{ steps.pick.outputs.arch-matrix }}
      fedora-versions: ${{ steps.pick.outputs.fedora-versions }}
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - name: Check the repository, the tag and the releases
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          FEDORA: ${{ inputs.fedora-versions }}
        run: |
          set -euo pipefail

          # what each repository's own release.yml passes to build-rpm.yml
          arm='["x86_64", "aarch64"]' mod=false deps=true bins=
          case "$REPOSITORY" in
            FreeMixer/omx-contract) package=omx-contract bins='omx-contract omx-contract-data omx-contract-devel' deps=false ;;
            FreeMixer/libdiginet) package=libdiginet bins='libdiginet libdiginet-devel diginet-tools' deps=false ;;
            FreeMixer/libmackie) package=libmackie bins='libmackie libmackie-devel' deps=false ;;
            FreeMixer/libsurface)
              package=libsurface
              bins='libsurface libsurface-devel libsurface-diginet libsurface-diginet-devel libsurface-mackie libsurface-mackie-devel surface-c24' ;;
            FreeMixer/plugin-db) package=plugin-db bins='plugin-db-devel plugin-db-contract' ;;
            FreeMixer/plugin-hostd-protocol)
              package=plugin-hostd-protocol bins='plugin-hostd-protocol plugin-hostd-protocol-devel plugin-hostd-protocol-contract' ;;
            FreeMixer/omx-dsp) package=omx-dsp bins=omx-dsp-devel ;;
            FreeMixer/omx-clap-core) package=omx-clap-host mod=true ;;
            FreeMixer/plugin-hostd) package=plugin-hostd mod=true ;;
            FreeMixer/plugin-qualify) package=plugin-qualify ;;
            FreeMixer/omx-panel) package=omx-panel bins=omx-panel ;;
            FreeMixer/omx-plugins) package=omx-plugins bins='omx-plugins omx-plugins-clap omx-plugins-lv2' ;;
            FreeMixer/omx-qualification-records)
              # noarch data, built once
              package=omx-qualification-records bins=omx-qualification-x86-64-fedora44 arm='["x86_64"]' deps=false ;;
            FreeREAC/libreac)
              package=libreac bins='libreac libreac-devel libreac-transport libreac-transport-devel' deps=false ;;
            FreeREAC/reac-pw) package=reac-pw ;;
            FreeREAC/reac-stageboxes) package=reac-stageboxes deps=false ;;
            *) echo "::error::'$REPOSITORY' is not a repository this workflow publishes"; exit 1 ;;
          esac

          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::'$TAG' does not match v<version>"; exit 1; }
          fedora=$(jq -c 'if type == "array" and length > 0 and all(.[]; type == "string" and test("^[0-9]+$"))
                          then . else error("not a non-empty array of release numbers") end' <<<"$FEDORA") ||
            { echo "::error::fedora-versions '$FEDORA' is not a JSON array of Fedora release numbers such as [\"45\"]"; exit 1; }

          ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha') \
            || { echo "::error::$REPOSITORY has no tag $TAG"; exit 1; }
          type=${ref% *}
          sha=${ref#* }
          # only an annotated tag carries a signature: a lightweight tag is a bare ref anyone with push access can move
          [ "$type" = tag ] || { echo "::error::the tag $TAG of $REPOSITORY is lightweight; publish from an annotated, signed tag"; exit 1; }
          read -r verified reason < <(gh api "repos/$REPOSITORY/git/tags/$sha" --jq '.verification | "\(.verified) \(.reason)"')
          [ "$verified" = true ] || { echo "::error::the tag $TAG of $REPOSITORY is not verified (reason: $reason)"; exit 1; }
          read -r otype commit < <(gh api "repos/$REPOSITORY/git/tags/$sha" --jq '.object.type + " " + .object.sha')
          [ "$otype" = commit ] || { echo "::error::the tag $TAG of $REPOSITORY points at a $otype, not a commit"; exit 1; }
          echo "::notice::$REPOSITORY $TAG is a verified annotated tag on $commit; Fedora $fedora"

          {
            echo "package=$package"
            echo "binaries=$bins"
            echo "needs-mod-host=$mod"
            echo "channel-deps=$deps"
            echo "arch-matrix=$arm"
            echo "fedora-versions=$fedora"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  rpm:
    needs: resolve
    # GitHub checks the called workflow's jobs against this job's grant even when they do not run: the GitHub release
    # (contents: write, never run here) and the failure report (issues: write); publishing itself uses PAGES_TOKEN
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/build-rpm.yml
    with:
      package-name: ${{ needs.resolve.outputs.package }}
      binary-names: ${{ needs.resolve.outputs.binaries }}
      publish: ${{ inputs.publish }}
      needs-mod-host: ${{ needs.resolve.outputs.needs-mod-host == 'true' }}
      channel-deps: ${{ needs.resolve.outputs.channel-deps == 'true' }}
      arch-matrix: ${{ needs.resolve.outputs.arch-matrix }}
      fedora-versions: ${{ needs.resolve.outputs.fedora-versions }}
      source-repository: ${{ inputs.repository }}
      source-ref: ${{ inputs.tag }}
      source-sha: ${{ needs.resolve.outputs.commit }}
      create-github-release: false
    secrets: inherit
