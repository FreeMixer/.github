name: Build RPM (reusable)

# One release path for every FreeMixer package, called by a thin workflow in the package's repository:
#
#   on: { push: { tags: ['v*'] }, workflow_dispatch: {} }
#   jobs:
#     rpm:
#       uses: FreeMixer/.github/.github/workflows/build-rpm.yml@main
#       with: { package-name: plugin-hostd }
#       secrets: inherit
#
# A tag builds the RPMs on every architecture of the matrix (each on a runner of its own architecture,
# in a Fedora container), signs them, publishes them into the rpm/ tree of the target Pages repository
# and attaches them to the GitHub release of the tag. Anything that is not a tag is a snapshot build: it
# publishes nothing and only assembles an UNSIGNED tree as an artifact. Unsigned metadata pushed to the
# channel would have clients trust it, and a published NEVRA cannot be taken back.
#
# The packaging lives in the calling repository: exactly one packaging/*.spec, whose Version: is the
# version, and a tag that must be v<Version> on the commit being built. A BuildRequires the channel already
# serves (plugin-hostd-devel) comes from the channel's repository, enabled inside the build container only.
#
# Secrets (organisation secrets, passed by `secrets: inherit`):
#   OPENMIXER_PACKAGES_SIGNING_KEY   the release key's packages subkey, armored, exported subkey-only and
#                                    without a passphrase (platform signing-keys.yml, project openmixer)
#   PAGES_TOKEN          token with contents write on the target repository
#
# The composite actions this workflow uses are ../actions of this repository, referenced at @main:
# a reusable workflow cannot name its own ref, so it moves with main like the workflow does.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label for the x86 jobs (a private repo passes its own runners, e.g. arc-freemixer; arm builds keep ubuntu-24.04-arm)'
      package-name:
        required: true
        type: string
        description: 'RPM package name, the name of the spec (e.g. plugin-hostd)'
      binary-names:
        type: string
        default: ''
        description: 'Binary RPMs the build must produce, space separated names or globs (e.g. omx-plugins-clap omx-plugins-lv2). Empty means package-name.'
      publish:
        type: boolean
        default: false
        description: 'Sign and publish. Takes effect on a tag only; false or a branch is a dry run.'
      target-repo:
        type: string
        default: 'FreeMixer/freemixer.github.io'
        description: 'Pages repository whose rpm/ tree receives the packages'
      base-url:
        type: string
        default: 'https://freemixer.github.io'
        description: 'Where the target repository is served, for the .repo file'
      arch-matrix:
        type: string
        default: '["x86_64", "aarch64"]'
        description: 'JSON array of architectures, each built natively'
      fedora-version:
        type: string
        default: '44'
        description: 'Fedora release of the build containers'
      needs-mod-host:
        type: boolean
        default: true
        description: 'Build and install mod-host-protocol-devel from the pinned mod-host first (BuildRequires pkgconfig(mod-host-protocol))'
      build-packages:
        type: string
        default: ''
        description: 'Extra distribution packages installed before the build, space separated'
      channel-deps:
        type: boolean
        default: true
        description: 'Take BuildRequires Fedora does not carry (plugin-hostd-devel) from the channel at base-url'
      create-github-release:
        type: boolean
        default: true
        description: 'Attach the signed RPMs to the GitHub release of the tag'
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY:
        required: false
      PAGES_TOKEN:
        required: false

defaults:
  run:
    shell: bash

jobs:
  # Fails a release before any build minutes are spent, and says what is missing.
  preflight:
    name: Check the release can publish
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: FreeMixer/.github/.github/actions/release-preflight@main
        with:
          publish: ${{ inputs.publish }}
          target: ${{ inputs.target-repo }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (fc${{ inputs.fedora-version }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || inputs.runner }}
    timeout-minutes: 45
    container:
      image: fedora:${{ inputs.fedora-version }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch-matrix) }}
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      # pipewire's jack first: mod-host's builddep would otherwise pull jack-audio-connection-kit-devel,
      # which conflicts with the one that spec asks for
      - name: Install the build tools
        env:
          EXTRA: ${{ inputs.build-packages }}
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip \
            pipewire-jack-audio-connection-kit-devel $EXTRA

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: FreeMixer/.github/.github/actions/mod-host-rpms@main
        if: inputs.needs-mod-host

      # for the build only: the repository exists in this container and is never a dependency of a release
      - name: Take build dependencies from the FreeMixer channel
        if: inputs.channel-deps
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          dnf config-manager addrepo --from-repofile="$BASE_URL/rpm/freemixer.repo"
          # -devel packages are noarch, in a tree of their own; a .repo published before it named that tree lacks it
          grep -q '^\[freemixer-noarch\]' /etc/yum.repos.d/freemixer.repo ||
            printf '%s\n' '' '[freemixer-noarch]' 'name=FreeMixer (noarch)' \
              "baseurl=$BASE_URL/rpm/fedora/\$releasever/noarch/" \
              'enabled=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
              "gpgkey=$BASE_URL/rpm/RPM-GPG-KEY-freemixer" >> /etc/yum.repos.d/freemixer.repo
          dnf -y makecache --repo freemixer --repo freemixer-noarch
          dnf repoquery --whatprovides 'pkgconfig(plugin-hostd)'

      - uses: FreeMixer/.github/.github/actions/build-rpm@main
        with:
          tag: ${{ env.RELEASE_TAG }}

      - name: Refuse an empty build, and one of another architecture
        env:
          ARCH: ${{ matrix.arch }}
          FIRST_ARCH: ${{ fromJSON(inputs.arch-matrix)[0] }}
          NAME: ${{ inputs.package-name }}
          BINARIES: ${{ inputs.binary-names }}
        run: |
          find rpms -name '*.rpm' | sort | tee built.txt
          test -s built.txt || { echo "::error::no RPM was produced"; exit 1; }
          ls rpms/"$NAME"-[0-9]*.src.rpm
          # noarch packages are built once, on the first architecture
          # the binaries are named after the source package unless binary-names says otherwise
          for bin in ${BINARIES:-$NAME}; do
            bins=$(find rpms \( -name "$bin-[0-9]*.$ARCH.rpm" -o -name "$bin-[0-9]*.noarch.rpm" \) | wc -l)
            [ "$bins" -gt 0 ] || { echo "::error::no $bin binary RPM for $ARCH"; exit 1; }
          done
          # every package the spec builds (its subpackages too: -devel, a library package), never
          # debuginfo/debugsource and never the mod-host BuildRequires built beside it
          mkdir -p release
          for pkg in $(rpmspec -q --qf '%{name}\n' packaging/*.spec | grep -vE -- '-debug(info|source)$' | sort -u); do
            cp rpms/"$pkg"-[0-9]*.rpm release/ 2>/dev/null || true
          done
          # the source and noarch packages come out of every job under the same file name with different
          # bytes; merge-multiple would write them over each other, so only the first architecture ships them
          if [ "$ARCH" != "$FIRST_ARCH" ]; then
            rm -f release/*.src.rpm release/*.noarch.rpm
          fi
          ls release/*.rpm | sort | tee release.txt
          # a noarch binary ships from the first architecture only, so a later one may stage fewer
          staged=0
          for bin in ${BINARIES:-$NAME}; do
            grep -q "/$bin-[0-9]" release.txt && staged=$((staged + 1))
          done
          if [ "$ARCH" = "$FIRST_ARCH" ]; then
            [ "$staged" -eq "$(echo ${BINARIES:-$NAME} | wc -w)" ] || { echo "::error::not every binary RPM (${BINARIES:-$NAME}) is among the staged RPMs"; exit 1; }
          fi

      # mod-host and its protocol library are built to satisfy BuildRequires and are not part of the release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-rpms-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: fedora:${{ inputs.fedora-version }}
    # The tree of the target repository is shared by every package and race-protected only by git's
    # refusal of a non-fast-forward push; one group per target serialises this organisation's runs.
    concurrency:
      group: publish-${{ inputs.target-repo }}
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref_type == 'tag' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.package-name }}-rpms-*
          merge-multiple: true
          path: collected

      - uses: FreeMixer/.github/.github/actions/publish-rpms@main
        with:
          rpm-dir: collected
          tag: ${{ github.ref_name }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          channel: ${{ inputs.target-repo }}
          base-url: ${{ inputs.base-url }}

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH == 'true'
        with:
          name: ${{ inputs.package-name }}-rpms-signed
          path: signed/*.rpm
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: ${{ inputs.package-name }}-unsigned-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30

      - name: Report a dry run honestly
        if: env.DO_PUBLISH != 'true'
        run: |
          echo "::warning::dry run: nothing was signed or published. The unsigned tree is attached to this run."

  release:
    name: GitHub release
    needs: publish
    if: inputs.publish && inputs.create-github-release && github.ref_type == 'tag'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package-name }}-rpms-signed
          path: signed

      - name: Attach the signed RPMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l signed
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" signed/*.rpm --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" signed/*.rpm --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
