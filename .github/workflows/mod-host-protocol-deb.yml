name: mod-host-protocol DEBs

# Builds libmod-host-protocol0 and libmod-host-protocol-dev from the pin of .github/pins.txt for every Debian
# release and architecture and publishes them into deb/ of the Pages repository, where omx-clap-host and
# plugin-hostd Depend on them as the RPMs Require libmod-host-protocol.so.0. Run by hand, once per pin: the
# packages carry the version of actions/deb-deps/mod-host-protocol/changelog, and a published version is never
# rebuilt with new bytes, so a moved pin needs a new changelog entry with it.
#
# publish=false, the default, is a dry run: it builds and assembles an unsigned tree as an artifact.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on the main branch publishes'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ inputs.publish }}
          require-tag: 'false'
          target: FreeMixer/freemixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4

      - uses: ./.github/actions/deb-deps
        with:
          names: mod-host-protocol

      - name: Lay the packages out by Debian release
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p "out/$SUITE"
          cp dep-debs/libmod-host-protocol*.deb "out/$SUITE/"

      - uses: actions/upload-artifact@v4
        with:
          name: mod-host-protocol-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: out
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-FreeMixer/freemixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mod-host-protocol-debs-*
          merge-multiple: true
          path: collected

      - uses: ./.github/actions/publish-debs
        with:
          deb-dir: collected
          tag: mod-host-protocol
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          # the original key co-signs the apt index while installs may hold only it (publish-debs)
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: mod-host-protocol-unsigned-apt-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30
