name: pugl and nanovg RPMs

# Builds pugl and nanovg, which Fedora does not package, from packaging/pugl and packaging/nanovg at the commits of
# .github/pins.txt, for every architecture, and publishes them into rpm/ of the Pages repository: omx-panel's renderer
# BuildRequires pugl-devel and nanovg-devel for its window. Each package carries .omx in its Release. Run by hand,
# once per change of either spec: a published NEVRA is never rebuilt with new bytes.
#
# publish=false, the default, is a dry run: it builds and assembles an unsigned tree as an artifact.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on the main branch publishes'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'packaging/pugl/**'
      - 'packaging/nanovg/**'
      - '.github/actions/pinned-rpms/**'
      - '.github/pins.txt'
      - '.github/workflows/pugl-nanovg-rpm.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release can publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from anywhere but main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: echo "::error::publish is only for a run on main"; exit 1

      - uses: actions/checkout@v4

      - uses: ./.github/actions/release-preflight
        with:
          publish: ${{ inputs.publish || false }}
          require-tag: 'false'
          target: FreeMixer/freemixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}

  build:
    name: Build (fc${{ matrix.fedora }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44']
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pinned-rpms
        with:
          names: pugl nanovg

      - name: Stage the packages and check what they carry
        env:
          ARCH: ${{ matrix.arch }}
          FEDORA: ${{ matrix.fedora }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp pinned-rpms/pugl-[0-9]*."$ARCH".rpm pinned-rpms/pugl-devel-[0-9]*."$ARCH".rpm \
            pinned-rpms/nanovg-[0-9]*."$ARCH".rpm pinned-rpms/nanovg-devel-[0-9]*."$ARCH".rpm release/
          # the source packages are the same for both architectures: one build files them
          if [ "$ARCH" = x86_64 ]; then cp pinned-rpms/SRPMS/*.src.rpm release/; fi
          for f in release/*.rpm; do
            evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$f")
            case "$evr" in *.omx.fc"$FEDORA") ;; *) echo "::error::$f: $evr does not carry .omx.fc$FEDORA"; exit 1 ;; esac
          done
          for pc in pugl-0 pugl-gl-0 pugl-cairo-0; do
            rpm -qp --provides release/pugl-devel-*.rpm | grep "^pkgconfig($pc)" || { echo "::error::pugl-devel does not provide pkgconfig($pc)"; exit 1; }
          done
          rpm -qp --provides release/nanovg-devel-*.rpm | grep '^pkgconfig(nanovg)' \
            || { echo "::error::nanovg-devel does not provide pkgconfig(nanovg)"; exit 1; }
          rpm -qp --provides release/nanovg-[0-9]*."$ARCH".rpm | grep '^libnanovg\.so\.0' \
            || { echo "::error::nanovg does not provide libnanovg.so.0"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pugl-nanovg-rpms-fc${{ matrix.fedora }}-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    concurrency:
      group: publish-FreeMixer/freemixer.github.io
      cancel-in-progress: false
    env:
      DO_PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pugl-nanovg-rpms-*
          merge-multiple: true
          path: collected

      - name: Read the versions the packages carry
        run: |
          echo "TAG=pugl-$(rpm -qp --qf '%{VERSION}-%{RELEASE}' collected/pugl-devel-*.x86_64.rpm)-nanovg-$(rpm -qp --qf '%{VERSION}-%{RELEASE}' collected/nanovg-devel-*.x86_64.rpm)" | tr '^' '_' >> "$GITHUB_ENV"

      - uses: ./.github/actions/publish-rpms
        with:
          rpm-dir: collected
          tag: ${{ env.TAG }}
          sign: ${{ env.DO_PUBLISH }}
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}

      - uses: actions/upload-artifact@v4
        if: env.DO_PUBLISH != 'true'
        with:
          name: pugl-nanovg-unsigned-rpm-tree
          path: build/repo/**
          if-no-files-found: error
          retention-days: 30
